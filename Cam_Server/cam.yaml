esphome:
  name: cam

esp32:
  board: esp32cam
  framework:
    type: esp-idf

# Enable logging
logger:

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: "Ab-Apart"
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cam Fallback Hotspot"
    password: !secret ap_password

captive_portal:
    
i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27

esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  # ⚠️ CRITICAL NON-PSRAM SETTINGS ⚠️
  frame_buffer_location: DRAM  # Force-route buffers away from PSRAM
  frame_buffer_count: 1        # Keep at 1 to minimize memory usage
  resolution: VGA              # 640x480
  #resolution: XGA             # 1024x768
  jpeg_quality: 30             # Lower quality (higher number) means smaller memory footprint

  # Image settings
  name: My Camera

# Serve the camera image directly over HTTP (independent of the web_server UI)
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot