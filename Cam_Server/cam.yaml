          s->set_ae_level(s, (int) x);
          ESP_LOGI("cam_ctl", "AE level -> %d", (int) x);

  - platform: template
    name: "Gain"
    id: cam_agc_gain
    icon: mdi:signal-variant
    entity_category: config
    optimistic: true
    mode: slider
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 0
    set_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_agc_gain(s, (int) x);
          ESP_LOGI("cam_ctl", "Gain -> %d", (int) x);

# --- Mirror H / V checkboxes -------------------------------------------------
# These drive the sensor directly (instead of id(my_camera).update_camera_parameters())
# so they don't reset the brightness/contrast/WB/... values set from the controls
# above every time you flip a mirror.
switch:
  - platform: template
    name: "Mirror Horizontal"
    id: cam_hmirror
    icon: mdi:flip-horizontal
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF   # matches init config above
    turn_on_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_hmirror(s, 1);
    turn_off_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_hmirror(s, 0);

  - platform: template
    name: "Mirror Vertical"
    id: cam_vflip
    icon: mdi:flip-vertical
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF   # matches init config above
    turn_on_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_vflip(s, 1);
    turn_off_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_vflip(s, 0);

# --- Auto exposure / gain / white balance ------------------------------------
# restore_mode defaults below mirror the OV2640 power-on defaults.
