          ESP_LOGI("cam_ctl", "Exposure value -> %d", (int) x);

  - platform: template
    name: "Exposure Level"
    id: cam_ae_level
    icon: mdi:brightness-auto
    entity_category: config
    optimistic: true
    mode: slider
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    set_action:
      - lambda: |-
