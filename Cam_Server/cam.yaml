# --- Exposure / gain sliders -------------------------------------------------
# Exposure Value / Gain only take effect when "Auto Exposure (AEC)" /
# "Auto Gain (AGC)" are switched OFF below.
  - platform: template
    name: "Exposure Value"
    id: cam_aec_value
    icon: mdi:camera-iris
    entity_category: config
    optimistic: true
    mode: slider
    min_value: 0
    max_value: 1200
    step: 1
    initial_value: 300
    set_action:
