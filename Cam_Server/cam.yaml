# --- On-board flash LED (GPIO4) ----------------------------------------------
# GPIO4 is the SD card's D1 line in 4-bit mode; the card above runs 1-bit, so
# GPIO4 stays free for the flash LED.
output:
  - platform: ledc
    pin: GPIO4
    id: flash_led_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "Flash LED"
    id: cam_flash_led
    output: flash_led_pwm
    icon: mdi:flashlight
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s