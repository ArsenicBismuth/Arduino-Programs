# =============================================================================
#  cam.yaml - ESP32-CAM (AI-Thinker, no PSRAM) + microSD snapshots
#
#  This is the board-specific half. Everything it shares with cam_s3.yaml lives
#  in common/cam_common.yaml, imported as a package below: ESPHome merges
#  packages deeply (mappings merge, lists concatenate, this file wins), so the
#  shared file supplies the camera logic, the web UI, the storage stack and all
#  the controls, and this file only carries what differs.
#
#    substitutions   every value cam_common.yaml asks for
#    [1] device      esphome name, esp32 target, lwIP tuning
#    [2] camera      pin map + the non-PSRAM memory profile + XGA boot frame
#    [5] diagnostics Heap Free
# =============================================================================

# =============================================================================
#  SUBSTITUTIONS
# =============================================================================
# The board's whole personality in one place. cam_common.yaml refers to these
# as ${...}; keep the keys and change only the values when adapting a new board.
substitutions:
  # --- identity ---------------------------------------------------------------
  dev_name: cam
  ap_ssid: "Cam Fallback Hotspot"

  # --- pin map ----------------------------------------------------------------
  i2c_sda: GPIO26            # SCCB SDA
  i2c_scl: GPIO27            # SCCB SCL
  sd_clk: GPIO14             # microSD, 1-bit SDMMC
  sd_cmd: GPIO15
  sd_d0: GPIO2
  led_pin: GPIO4             # on-board flash LED (also SD D1 in 4-bit mode)
  led_inverted: "false"      # this LED lights when the pin is high
  led_name: "Flash LED"
  led_icon: mdi:flashlight

  # --- camera defaults --------------------------------------------------------
  # No PSRAM: one DRAM frame buffer, so the controls start conservative.
  resolution_initial: "1024x768"
  compression_initial: 30
  max_fps: 5

  # --- camera sensor ----------------------------------------------------------
  # Which sensor sits on the module. Two things depend on it, both to do with the
  # AGC gain ceiling: the on_boot hook in cam_common.yaml [1] and the "Gain
  # Ceiling" control in [6] there. The OV2640 encodes that ceiling as a step in
  # COM9, the OV3660/OV5640 as a Q4.4 value in 0x3A18/0x3A19, and esp32-camera's
  # set_gainceiling() only gets the OV2640 case right. Detection itself is
  # automatic over SCCB - this substitution only picks the encoding.
  cam_sensor: "ov3660"

  # Value the "Gain Ceiling" control starts at. 16X (0x100 = 16x) is the closest
  # step to the 15.5x the shared boot hook installs.
  agc_ceiling_initial: "16X"

packages:
  - !include common/cam_common.yaml

# =============================================================================
#  [1] DEVICE & NETWORK
# =============================================================================
esphome:
  name: ${dev_name}

  # Without PSRAM the camera can't allocate an XGA-sized frame buffer at boot
  # (1024x768 reserves ~154 KB contiguous internal RAM, VGA only ~60 KB), so
  # `resolution:` below stays at VGA and we switch to XGA here instead.
  # `set_framesize()` only rewrites sensor registers - no new allocation - which
  # is exactly why changing resolution at runtime always worked.
  # priority -100.0 runs after every component (incl. the camera) is initialised.
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            sensor_t *s = esp_camera_sensor_get();
            if (s == nullptr) {
              ESP_LOGW("cam_ctl", "Camera sensor unavailable; keeping boot resolution");
              return;
            }
            s->set_framesize(s, FRAMESIZE_XGA);
            ESP_LOGI("cam_ctl", "Boot resolution -> 1024x768 (XGA)");
            // The AGC gain-ceiling repair for the OV3660 runs from the shared
            // on_boot hook in cam_common.yaml [1]; nothing to do here.

esp32:
  board: esp32cam
  framework:
    sdkconfig_options:
      # No PSRAM: ~4-10 KB free heap at runtime. Halve lwIP's per-connection buffers so the
      # 7 web sockets plus the two camera servers still fit (and sends can allocate).
      CONFIG_LWIP_TCP_WND_DEFAULT: "2880"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "2880"
      # Keep FatFs's long-filename buffer on the stack here, overriding the shared
      # LFN_HEAP: on this board the heap is the scarce resource (~4-10 KB, largest
      # block ~1.5 KB), and HEAP turns every f_open()/f_opendir()/f_stat() into a
      # 512-byte malloc/free - churn that fragments exactly what the page build
      # needs. The httpd stack is the same 4 KB as on the S3, but SDMMC's call depth
      # is shallower than sdspi's, so STACK fits (and did for months).
      # sdkconfig defaults are applied alphabetically and the last one wins
      # (HEAP < NONE < STACK), hence the explicit "n".
      CONFIG_FATFS_LFN_HEAP: "n"
      CONFIG_FATFS_LFN_STACK: "y"

# =============================================================================
#  [2] CAMERA
# =============================================================================
esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  # ⚠️ CRITICAL NON-PSRAM SETTINGS ⚠️
  # A JPEG buffer is sized as width*height/5, so VGA = ~60 KB and XGA = ~154 KB.
  # Only VGA fits internal RAM at boot; the on_boot lambda above then moves the
  # sensor to XGA without allocating anything new, which is as far as this board
  # goes - anything larger overruns the buffer and the driver drops the frame.
  frame_buffer_location: DRAM  # Force-route buffers away from PSRAM
  frame_buffer_count: 1        # Keep at 1 to minimize memory usage
  resolution: VGA              # Boot buffer size only - on_boot switches the sensor to XGA after init
  jpeg_quality: 30             # Lower quality (higher number) means smaller memory footprint
  max_framerate: ${max_fps} fps

# =============================================================================
#  [5] DIAGNOSTICS
# =============================================================================
# Appended to the shared `sensor:` list (Change Score). Left ungrouped here
# because this build has only the one extra sensor.
sensor:
  - platform: debug
    free:
      name: "Heap Free"
      unit_of_measurement: "B" # B for Bytes
      icon: "mdi:memory"

# =============================================================================
#  [6] ON-BOARD LED
# =============================================================================
# Board-specific: GPIO4 here is only the flash LED (see common/cam_common.yaml).
output:
  - platform: ledc
    pin:
      number: ${led_pin}
      inverted: ${led_inverted}
    id: flash_led_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "${led_name}"
    id: cam_flash_led
    output: flash_led_pwm
    icon: ${led_icon}
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    web_server:
      sorting_group_id: cam_grp_basic
      sorting_weight: 40
