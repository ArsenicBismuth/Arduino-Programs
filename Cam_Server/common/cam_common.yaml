# -----------------------------------------------------------------------------
#  Switches
# -----------------------------------------------------------------------------
switch:
  # --- Basic ------------------------------------------------------------------
  # Mirror H / V drive the sensor directly (instead of
  # id(my_camera).update_camera_parameters()) so they don't reset the
  # brightness/contrast/WB/... values set from the controls every time you flip.
  - platform: template
    name: "Mirror Horizontal"
    id: cam_hmirror
    icon: mdi:flip-horizontal
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF   # matches init config above
    turn_on_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_hmirror(s, 1);
    turn_off_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_hmirror(s, 0);
    web_server:
      sorting_group_id: cam_grp_basic
      sorting_weight: 20

  - platform: template
    name: "Mirror Vertical"
    id: cam_vflip
    icon: mdi:flip-vertical
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF   # matches init config above
    turn_on_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_vflip(s, 1);
    turn_off_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_vflip(s, 0);
    web_server:
      sorting_group_id: cam_grp_basic
      sorting_weight: 30

  # --- Snapshots --------------------------------------------------------------
  - platform: template
    name: "Auto Snapshot"
    id: cam_auto
    icon: mdi:camera-timer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: cam_grp_snapshots
      sorting_weight: 20

  # When on, frames whose "Change Score" is below "Change Threshold" are
  # skipped instead of written, so a static scene doesn't fill the card.
  - platform: template
    name: "Change Gate"
    id: cam_gate_enabled
    icon: mdi:compare
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: cam_grp_snapshots
      sorting_weight: 30

  # --- Advanced image (rarely used) ------------------------------------------
  # Auto exposure / gain / white balance. restore_mode defaults below mirror the
  # OV2640 power-on defaults.
  - platform: template
    name: "Auto Exposure (AEC)"
    id: cam_aec
    icon: mdi:camera-iris
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_exposure_ctrl(s, 1);
    turn_off_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_exposure_ctrl(s, 0);
    web_server:
      sorting_group_id: cam_grp_advanced
      sorting_weight: 110

  - platform: template
    name: "Auto Gain (AGC)"
    id: cam_agc
    icon: mdi:tune-variant
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_gain_ctrl(s, 1);
    turn_off_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_gain_ctrl(s, 0);
    web_server:
      sorting_group_id: cam_grp_advanced
      sorting_weight: 120

  - platform: template
    name: "Auto White Balance (AWB)"
    id: cam_awb
    icon: mdi:white-balance-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
