# =============================================================================
#  cam_common.yaml - the shared half of cam.yaml and cam_s3.yaml
#
#  This file is NOT a device config and cannot be built on its own. Both board
#  files import it as a package:
#
#      packages:
#        - !include cam_common.yaml
#
#  ESPHome merges packages deeply: mappings merge key by key, lists concatenate
#  (package entries first, then the board file's), and anything the board file
#  sets wins. So every block below is inherited unless a board file overrides
#  the same key, and a board file can append entities to a shared list without
#  restating it.
#
#  Everything board-specific reaches this file as a ${substitution}; the values
#  live in the substitution table at the top of each board file. Where a block
#  is partly shared and partly per-board (the camera), the board file sets only
#  the differing keys and the rest arrives from here.
#
#    [1] Device & network   esphome(includes) / esp32(framework) / logger / ota /
#                           wifi / time / i2c
#    [2] Camera             esp32_camera: shared keys + on_image snapshot logic
#    [3] Web                web_server + the MJPEG / snapshot HTTP servers
#    [4] microSD storage    sd_mmc_card + /file browser + /latest endpoint
#    [5] Snapshot logic     globals / Save button / Change Score / retention
#    [6] Controls           Basic | Frame rate | Snapshots | Retention | Advanced
#
# =============================================================================

# =============================================================================
#  [1] DEVICE & NETWORK
# =============================================================================
esphome:
  # `name:` is board-specific (cam / cam-s3): two devices sharing a name would
  # make OTA and mDNS ambiguous. Only the helper headers are shared.
  #
  #   cam_ctl.h      - cam_sensor() / CAM_SENSOR_OR_RETURN() camera helpers
  #   cam_snapshot.h - cam_gate::* JPEG change detection and cam_store::* SD helpers
  includes:
    - cam_ctl.h
    - cam_snapshot.h

  # Repair the AGC gain ceiling once the camera component is initialised.
  # esp32_camera always calls set_gainceiling() with `agc_gain_ceiling:` (default
  # "2X" = enum step 0). On the OV3660/OV5640 that step is written raw into
  # 0x3A18/0x3A19, which is a Q4.4 ceiling there - step 0 becomes 0x0000, below
  # unity, which pins AGC at minimum gain and underexposes every frame. Restore
  # the sensor's own 15.5x default instead. Boards with `cam_sensor: "ov2640"`
  # skip it: there the enum *is* the COM9 value and 2X is correct.
  # priority -100.0 runs after every component (incl. the camera) is set up.
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            sensor_t *s = esp_camera_sensor_get();
            if (s == nullptr)
              return;
            if (cam_sensor_uses_q44_ceiling("${cam_sensor}")) {
              cam_gain_ceiling_q44(s, 0xF8);  // Q4.4: 15.5x
              ESP_LOGI("cam_ctl", "AGC gain ceiling -> 15.5x (0x3A18/0x3A19)");
            }

# Only the framework wiring is shared. Each board file sets `board:` (plus
# flash_size / cpu_frequency / psram on the S3) and adds its own sdkconfig keys
# next to the ones below.
esp32:
  framework:
    type: esp-idf
    # The SD card component needs FatFs and VFS directory support, which
    # ESPHome excludes by default to save flash; re-enable both here.
    advanced:
      include_builtin_idf_components: ["fatfs", "spiffs"]
      disable_vfs_support_dir: false
    sdkconfig_options:
      # Long file names, needed for names like snap_20261017_141530.jpg
      CONFIG_FATFS_LFN_STACK: "y"

# Enable logging
logger:

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: "Ab-Apart"
  password: !secret wifi_password

  # Default modem sleep measured here: 19-170 ms pings, ~26% loss; off: 4-13 ms, ~10%.
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${ap_ssid}
    password: !secret ap_password

captive_portal:

# Network time, used to stamp snapshot filenames with local time.
time:
  - platform: sntp
    id: cam_time
    timezone: Europe/Berlin

i2c:
  # SCCB pins for the camera module, from the board file.
  - id: camera_i2c
    sda: ${i2c_sda}
    scl: ${i2c_scl}

# =============================================================================
#  [2] CAMERA
# =============================================================================
# The pin map, the frame buffer profile and the frame-rate cap are the only
# board-specific parts of the camera and live in the board file. Everything
# below is shared, including the whole snapshot-on-image logic at the bottom.
esp32_camera:
  i2c_id: camera_i2c

  # Image settings
  name: My Camera
  id: my_camera
  aec2: true                   # AEC DSP: better indoor low-light exposure

  # Boot-time orientation
  vertical_flip: true
  horizontal_mirror: true

  # Background frame rate. This is the cadence the periodic snapshot rides on,
  # so raising it lets "Snapshot Period" actually fire more often (down to the
  # period you set in the Snapshots group below).
  idle_framerate: 0.1 fps

  # This is the only safe way to get a frame: esp32_camera's own framebuffer
  # task owns the driver's buffers, so calling esp_camera_fb_get() directly
  # returns nullptr here. Note on_image also fires for the camera's *idle*
  # frames (~every 10 s, `idle_framerate`), so a periodic snapshot needs no
  # extra request_image() polling - it piggybacks on frames the camera was
  # going to take anyway.
  on_image:
    then:
      - lambda: |-
          const bool manual = id(cam_save_requested);
          if (manual)
            id(cam_save_requested) = false;

          // --- scheduled snapshot, unless this is a manual "Save Snapshot" ---
          if (!manual) {
            if (!id(cam_auto)->state)
              return;
            const uint32_t period_ms = static_cast<uint32_t>(id(cam_period)->state * 1000.0f);
            const uint32_t now = millis();
            if (period_ms == 0 || now - id(cam_last_auto_ms) < period_ms)
              return;
            id(cam_last_auto_ms) = now;

            // --- change gate: skip frames that look like the last one kept ---
            if (id(cam_gate_enabled)->state) {
              const int score = cam_gate::analyze(image.data, image.length);
              if (score >= 0)
                id(cam_change_score)->publish_state(score);
              const float threshold = id(cam_threshold)->state;
              if (score >= 0 && static_cast<float>(score) < threshold) {
                ESP_LOGD("cam_snap", "Changed by %d (< %.0f), skipped", score, threshold);
                return;
              }
            }
          }

          // --- write to /snap/<YYYYMMDD>/<HHMMSS>.jpg plus a /latest.jpg copy ---
          char path[96];
          auto t = id(cam_time).now();
          if (t.is_valid()) {
            char dir[48];
            snprintf(dir, sizeof(dir), "/snap/%04d%02d%02d", t.year, t.month, t.day_of_month);
            if (!id(sd_card)->is_directory(dir)) {
              if (!id(sd_card)->is_directory("/snap"))
                id(sd_card)->create_directory("/snap");
              id(sd_card)->create_directory(dir);
            }
            snprintf(path, sizeof(path), "/sdcard%s/%02d%02d%02d.jpg",
                     dir, t.hour, t.minute, t.second);
          } else if (manual) {
            // RTC not synced yet: keep manual saves working with a fallback name.
            // Leading '0' keeps it sorted before "latest.jpg" for /latest.
            snprintf(path, sizeof(path), "/sdcard/0nosync_%lu.jpg", (unsigned long) millis());
          } else {
            ESP_LOGW("cam_snap", "Time not synced, skipping scheduled snapshot");
            return;
          }

          if (cam_store::write_file(path, image.data, image.length)) {
            cam_store::write_file("/sdcard/latest.jpg", image.data, image.length);
            cam_gate::commit();
            ESP_LOGI("cam_snap", "Saved %s (%u bytes, score %d)",
                     path, (unsigned) image.length, cam_gate::last_score());
          } else {
            ESP_LOGE("cam_snap", "Failed to write %s", path);
          }

# =============================================================================
#  [3] WEB
# =============================================================================
# Browser control UI + REST API (v3). Also hosts the runtime camera controls.
# cam_stream.js/.css inject a "Camera" panel that opens the :8080 MJPEG stream
# on demand (button click), so no stream connection is made on page load. They
# also add a floating "?" button listing the other endpoints: /file, /latest,
# and the camera servers on :8080 (stream) / :8081 (snapshot).
#
# The UI groups entities into named sections using v3 sorting_groups; each
# entity opts in with its own `web_server: { sorting_group_id, sorting_weight }`
# block (search for "sorting_group_id" below). Groups sort by `sorting_weight`,
# entities within a group sort by their `sorting_weight`.
#
# A board file can append a group by repeating `web_server: sorting_groups:`
# with just its own entry - the lists concatenate (cam_s3.yaml adds
# "Diagnostics" this way).
web_server:
  version: 3
  port: 80
  js_include: cam_stream.js
  css_include: cam_stream.css
  sorting_groups:
    - id: cam_grp_basic
      name: "Basic"
      sorting_weight: 10
    - id: cam_grp_framerate
      name: "Frame Rate"
      sorting_weight: 20
    - id: cam_grp_snapshots
      name: "Snapshots"
      sorting_weight: 30
    - id: cam_grp_retention
      name: "Retention"
      sorting_weight: 40
    - id: cam_grp_advanced
      name: "Image Processing (Advanced)"
      sorting_weight: 50

# Serve the camera image directly over HTTP (independent of the web_server UI)
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# =============================================================================
#  [4] microSD STORAGE
# =============================================================================
# SD driver (components/sd_mmc_card), the /file browser (components/sd_file_server,
# locally patched to stream downloads), and the /latest endpoint
# (components/latest_snapshot) - see components/README.md.
external_components:
  - source:
      type: local
      path: components
    components: [sd_mmc_card, sd_file_server, latest_snapshot]

# --- microSD card (SDMMC, 1-bit) ---------------------------------------------
# Both boards run the slot 1-bit (CLK/CMD/D0, from the board file). That is
# roughly twice as fast as SPI and leaves the card's other data lines free for
# whatever else the board wires there - on the AI-Thinker that is the flash LED
# (GPIO4 = D1), on the XIAO the user LED (GPIO21 = SPI CS).
sd_mmc_card:
  id: sd_card
  mode_1bit: true
  format_if_mount_failed: false   # never auto-format the card
  clk_pin: ${sd_clk}
  cmd_pin: ${sd_cmd}
  data0_pin: ${sd_d0}

# Browse/download the card in a browser at http://<host>/file
# (upload and deletion don't work reliably under the esp-idf framework).
sd_file_server:
  id: sd_files
  url_prefix: file
  root_path: "/"
  enable_download: true
  enable_deletion: true
  enable_upload: false

# Serve the newest snapshot straight off the card, no UI:
#   GET http://<host>/latest  ->  newest *.jpg in /sdcard, as image/jpeg
# Local component in components/latest_snapshot; it streams the file in small chunks so
# the whole image is never buffered in RAM (see components/README.md -> "Troubleshooting log").
latest_snapshot:
  id: latest_snapshot_srv
  url: /latest
  root: /sdcard
  extension: .jpg

# =============================================================================
#  [5] SNAPSHOT LOGIC
# =============================================================================
# The writes themselves happen in esp32_camera's on_image trigger (see [2]); the
# pieces here are the state it needs plus the manual-save button, the tuning
# sensor and the retention pass.

globals:
  - id: cam_save_requested
    type: bool
    restore_value: no
    initial_value: "false"
  # millis() at the last scheduled (non-manual) snapshot, for the period check.
  - id: cam_last_auto_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# --- Manual "Save Snapshot" button -------------------------------------------
button:
  - platform: template
    name: "Save Snapshot"
    id: cam_save_snapshot
    icon: mdi:content-save
    on_press:
      - lambda: |-
          id(cam_save_requested) = true;
          id(my_camera)->request_image(camera::IDLE);
    web_server:
      sorting_group_id: cam_grp_snapshots
      sorting_weight: 10
  - platform: restart
    name: "Restart"
    id: cam_restart
    icon: "mdi:restart"
    entity_category: diagnostic

# --- Change score (for tuning the gate) --------------------------------------
# The board files add their own memory sensors to this list (see [5] there).
sensor:
  # Mean luma difference of the newest frame vs. the last kept one (0..255).
  # Useful for tuning "Change Threshold": watch it while something moves.
  - platform: template
    name: "Change Score"
    id: cam_change_score
    icon: mdi:image-filter-center-focus
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
    web_server:
      sorting_group_id: cam_grp_snapshots
      sorting_weight: 40

# Enables the ability to read debug information.
debug:
  update_interval: 1min # How often to check the memory.

# --- Retention ---------------------------------------------------------------
# Once a day, delete files older than the retention window (age from the FAT
# mtime), then drop empty day folders. The pass drains in bounded 100-file
# batches so a big backlog can't stall the main loop in one go, but gives up
# after 2000 files so the worst case stays bounded. Note this runs regardless
# of the "Auto Snapshot" switch, and (like any ESPHome interval) first fires
# ~24 h after boot - a device rebooted more often than that never prunes.
interval:
  - interval: 24h
    then:
      - lambda: |-
          const int days = (int) id(cam_retention_days)->state;
          int total = 0;
          int n;
          do {
            n = cam_store::prune("/sdcard/snap", days, 100);
            total += n;
          } while (n == 100 && total < 2000);
          if (total > 0)
            ESP_LOGI("cam_snap", "Pruned %d old snapshot(s)", total);

# =============================================================================
#  [6] CONTROLS
#  Entities are grouped as: Basic -> Frame rate -> Snapshots -> Retention ->
#  Advanced image (-> Diagnostics on the S3). The defaults marked with a
#  ${substitution} come from the board file, which knows how much frame buffer
#  it has.
#  Each entity's `web_server.sorting_group_id` selects its UI section and
#  `sorting_weight` orders it inside that section.
# =============================================================================

# -----------------------------------------------------------------------------
#  Selects
# -----------------------------------------------------------------------------
select:
  # --- Basic ------------------------------------------------------------------
  # Resolution selector. The board file's `resolution:` only sizes the boot
  # buffer; this rewrites the sensor registers live (no allocation), which is
  # why it can go up to the boot buffer's resolution without a restart.
  - platform: template
    name: "Resolution"
    id: cam_resolution
    icon: mdi:aspect-ratio
    entity_category: config
    optimistic: true
    initial_option: ${resolution_initial}
    options:
      - "160x120"    # QQVGA
      - "320x240"    # QVGA
      - "400x296"    # CIF
      - "640x480"    # VGA
      - "800x600"    # SVGA
      - "1024x768"   # XGA
      - "1280x1024"  # SXGA
      - "1600x1200"  # UXGA
    set_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          framesize_t f = FRAMESIZE_VGA;
          if      (x == "160x120") f = FRAMESIZE_QQVGA;
          else if (x == "320x240") f = FRAMESIZE_QVGA;
          else if (x == "400x296") f = FRAMESIZE_CIF;
          else if (x == "640x480") f = FRAMESIZE_VGA;
          else if (x == "800x600") f = FRAMESIZE_SVGA;
          else if (x == "1024x768") f = FRAMESIZE_XGA;
          else if (x == "1280x1024") f = FRAMESIZE_SXGA;
          else if (x == "1600x1200") f = FRAMESIZE_UXGA;
          s->set_framesize(s, f);
          ESP_LOGI("cam_ctl", "Resolution -> %s", x.c_str());
    web_server:
      sorting_group_id: cam_grp_basic
      sorting_weight: 10

  # --- Advanced image (rarely used) ------------------------------------------
  # White balance mode
  - platform: template
    name: "White Balance Mode"
    id: cam_wb_mode
    icon: mdi:white-balance-auto
    entity_category: config
    optimistic: true
    initial_option: "Auto"
    options:
      - "Auto"    # 0
      - "Sunny"   # 1
      - "Cloudy"  # 2
      - "Office"  # 3
      - "Home"    # 4
    set_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          int m = 0;
          if      (x == "Sunny")  m = 1;
          else if (x == "Cloudy") m = 2;
          else if (x == "Office") m = 3;
          else if (x == "Home")   m = 4;
          s->set_wb_mode(s, m);
          ESP_LOGI("cam_ctl", "WB mode -> %s", x.c_str());
    web_server:
      sorting_group_id: cam_grp_advanced
      sorting_weight: 80

  # AGC gain ceiling.
  # The 2X..128X labels are the gainceiling_t steps ESPHome uses for its
  # `agc_gain_ceiling:` option, but the two sensor families encode them
  # differently:
  #   OV2640  - the step goes into COM9 bits 5..7, so s->set_gainceiling() is
  #             exactly right and 2X means a real 2x ceiling.
  #   OV3660/ - 0x3A18/0x3A19 is a Q4.4 ceiling: 0x10 = 1x, 0x20 = 2x, 0xF8 =
  #   OV5640    15.5x, and the register tops out at 0x3FF = 63.9x. Writing the raw
  #             step there makes "2X" come out as 0x0000 - below unity - which
  #             pins AGC at minimum gain and underexposes every frame. So map the
  #             step to its actual gain instead: cam_gain_ceiling_q44().
  # Which branch runs comes from the board file's `cam_sensor` substitution. The
  # actual boot value (15.5x) comes from the on_boot hook in [1];
  # `agc_ceiling_initial` in the board file only picks the step shown here.
  - platform: template
    name: "Gain Ceiling"
    id: cam_gain_ceiling
    icon: mdi:signal
    entity_category: config
    optimistic: true
    initial_option: "${agc_ceiling_initial}"
    options:
      - "2X"       # 0x020 = 2x
      - "4X"       # 0x040 = 4x
      - "8X"       # 0x080 = 8x
      - "16X"      # 0x100 = 16x
      - "32X"      # 0x200 = 32x
      - "64X"      # 0x400 = 64x, clamped to the register max below
      - "128X"     # same 63.9x ceiling - the sensor can't go higher
    set_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          int step = 0;
          if      (x == "4X")   step = 1;
          else if (x == "8X")   step = 2;
          else if (x == "16X")  step = 3;
          else if (x == "32X")  step = 4;
          else if (x == "64X")  step = 5;
          else if (x == "128X") step = 6;

          if (cam_sensor_uses_q44_ceiling("${cam_sensor}")) {
            // step 0 is 2x, so the Q4.4 value is 0x10 (1x) scaled by step + 1.
            cam_gain_ceiling_q44(s, (uint16_t) (0x10 << (step + 1)));
          } else {
            s->set_gainceiling(s, (gainceiling_t) step);
          }
          ESP_LOGI("cam_ctl", "Gain ceiling -> %s", x.c_str());
    web_server:
      sorting_group_id: cam_grp_advanced
      sorting_weight: 90

  # Special effect
  - platform: template
    name: "Special Effect"
    id: cam_special_effect
    icon: mdi:magic-staff
    entity_category: config
    optimistic: true
    initial_option: "None"
    options:
      - "None"
      - "Negative"
      - "Grayscale"
      - "Red Tint"
      - "Green Tint"
      - "Blue Tint"
      - "Sepia"
    set_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          int e = 0;
          if      (x == "Negative")   e = 1;
          else if (x == "Grayscale")  e = 2;
          else if (x == "Red Tint")   e = 3;
          else if (x == "Green Tint") e = 4;
          else if (x == "Blue Tint")  e = 5;
          else if (x == "Sepia")      e = 6;
          s->set_special_effect(s, e);
          ESP_LOGI("cam_ctl", "Special effect -> %s", x.c_str());
    web_server:
      sorting_group_id: cam_grp_advanced
      sorting_weight: 100

# -----------------------------------------------------------------------------
#  Numbers
# -----------------------------------------------------------------------------
number:
  # --- Frame rate -------------------------------------------------------------
  # `max_framerate` cap while the MJPEG stream is open. Written live via
  # set_max_update_interval(); the sensor tops out well below 60 at higher
  # resolutions, so treat 60 as the accepted ceiling, not a promise.
  # The default matches the board file's `max_framerate:`.
  - platform: template
    name: "Max FPS"
    id: cam_max_fps
    icon: mdi:speedometer
    unit_of_measurement: fps
    entity_category: config
    optimistic: true
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    initial_value: ${max_fps}
    set_action:
      - lambda: |-
          id(my_camera)->set_max_update_interval((uint32_t) (1000.0f / x));
          ESP_LOGI("cam_ctl", "Max FPS -> %.0f", x);
    web_server:
      sorting_group_id: cam_grp_framerate
      sorting_weight: 10

  # Background frame rate. This is the cadence the periodic snapshot rides on,
  # so raising it lets "Snapshot Period" actually fire more often (down to the
  # period you set in the Snapshots group below).
  - platform: template
    name: "Idle FPS"
    id: cam_idle_fps
    icon: mdi:timer-sand
    unit_of_measurement: fps
    entity_category: config
    optimistic: true
    mode: box
    min_value: 0.1
    max_value: 1
    step: 0.1
    initial_value: 0.1
    set_action:
      - lambda: |-
          id(my_camera)->set_idle_update_interval((uint32_t) (1000.0f / x));
          ESP_LOGI("cam_ctl", "Idle FPS -> %.1f", x);
    web_server:
      sorting_group_id: cam_grp_framerate
      sorting_weight: 20

  # --- Snapshots --------------------------------------------------------------
  # Minimum spacing between scheduled snapshots. The effective rate is also
  # bounded by "Idle FPS" above (a snapshot can't be taken faster than frames
  # arrive), and the change gate can skip frames that are too similar.
  - platform: template
    name: "Snapshot Period"
    id: cam_period
    icon: mdi:timer-outline
    unit_of_measurement: s
    entity_category: config
    optimistic: true
    mode: box
    min_value: 2
    max_value: 3600
    step: 1
    initial_value: 10
    web_server:
      sorting_group_id: cam_grp_snapshots
      sorting_weight: 50

  # Mean luma difference (0..255) below which a frame is considered "the same"
  # and not written. Watch the "Change Score" sensor to tune this.
  - platform: template
    name: "Change Threshold"
    id: cam_threshold
    icon: mdi:delta
    entity_category: config
    optimistic: true
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 10
    web_server:
      sorting_group_id: cam_grp_snapshots
      sorting_weight: 60

  # --- Retention --------------------------------------------------------------
  # Snapshots older than this are deleted by the retention pass in [5].
  - platform: template
    name: "Retention Days"
    id: cam_retention_days
    icon: mdi:calendar-remove
    unit_of_measurement: d
    entity_category: config
    optimistic: true
    mode: box
    min_value: 1
    max_value: 90
    step: 1
    initial_value: 7
    web_server:
      sorting_group_id: cam_grp_retention
      sorting_weight: 10

  # --- Advanced image (rarely used) ------------------------------------------
  # Compression (JPEG quality): higher = more compression = smaller frames.
  # The default is board-specific (${compression_initial}) because a sharper
  # JPEG has to still fit the frame buffer: 12 on the S3's ~384 KB PSRAM
  # buffers, 30 on the AI-Thinker's ~60 KB DRAM buffer.
  - platform: template
    name: "Compression"
    id: cam_compression
    icon: mdi:image-size-select-small
    entity_category: config
    optimistic: true
    mode: slider
    min_value: 6
    max_value: 63
    step: 1
    initial_value: ${compression_initial}
    set_action:
      - lambda: |-
          CAM_SENSOR_OR_RETURN();
          s->set_quality(s, (int) x);
          ESP_LOGI("cam_ctl", "Compression -> %d", (int) x);
    web_server:
      sorting_group_id: cam_grp_advanced
      sorting_weight: 10

  # Image sliders (OV2640 range -2..2)
  - platform: template
    name: "Brightness"
    id: cam_brightness
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    mode: slider
