# -----------------------------------------------------------------------------
#  On-board LED (Basic)
# -----------------------------------------------------------------------------
# Pin, polarity and name come from the board file: the AI-Thinker has a flash
# LED on GPIO4 (active high), the XIAO a user LED on GPIO21 (active low).
output:
  - platform: ledc
    pin:
      number: ${led_pin}
      inverted: ${led_inverted}
    id: flash_led_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "${led_name}"
    id: cam_flash_led
    output: flash_led_pwm
    icon: ${led_icon}
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    web_server:
      sorting_group_id: cam_grp_basic
      sorting_weight: 40
